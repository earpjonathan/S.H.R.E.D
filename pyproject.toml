[project]
name = "cardcutter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "earpjonathan", email = "jonathan.earp55@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic==2.7.0",
    "ddgs==9.16.1",
    "fastapi==0.162.2",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "lxml==6.1.3",
    "numpy==2.5.4",
    "pymupdf==2.1",
    "python-multipart==0.0.33",
    "trafilatura==2.3.1",
    "typer==0.29.0",
    "uvicorn==0.54.0",
]

[project.scripts]
cardcutter = "cardcutter:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis==6.170.15",
    "pytest==9.2.0",
]
